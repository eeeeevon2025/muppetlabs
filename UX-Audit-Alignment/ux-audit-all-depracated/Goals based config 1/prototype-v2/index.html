<div id="root"></div>

<script>
  // Default landing route is the populated Goals page so reviewers see the
  // full hi-fi state immediately. The first-run wizard is still reachable via
  // #firstrun (e.g. the empty state CTA), and we keep the onboarded flag set
  // so nothing else tries to redirect.
  // Default landing: Goals page in empty state so the hi-fi onboarding
  // hero + suggested-templates layout is the first thing reviewers see.
  window.__EMPTY_GOALS__ = true;
  try { window.localStorage.setItem("v2-onboarded", "1"); } catch (e) {}
  window.location.hash = "goals";
</script>
