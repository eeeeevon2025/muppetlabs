<title>Kustomer · Goals Based AI Outcome</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
  body { background: #fff; }
  button:focus-visible { outline: 2px solid #6E79E0; outline-offset: 2px; }
  /* Subtle scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #DCE0E9; border-radius: 999px; border: 2px solid #fff; }
  ::-webkit-scrollbar-thumb:hover { background: #B3BBCB; }

  /* ── Print: render the app as a fixed-size landscape snapshot ── */
  @media print {
    @page { size: 1440px 900px; margin: 0; }
    html, body {
      width: 1440px; height: 900px;
      margin: 0; padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    #root {
      width: 1440px; height: 900px;
      overflow: hidden;
    }
    /* Hide scrollbars in print */
    ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    /* Disable hover/animations during print */
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</head>

<script type="text/babel">
  // Auto-print once fonts + React app have rendered.
  (async () => {
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
    // Wait for the React root to populate.
    const start = Date.now();
    while (!document.getElementById("root").firstChild && Date.now() - start < 4000) {
      await new Promise(r => setTimeout(r, 100));
    }
    setTimeout(() => window.print(), 500);
  })();
</script>
