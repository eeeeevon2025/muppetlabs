<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Monitoring · embed</title>
<link rel="stylesheet" href="kustomer/colors_and_type.css"/>
<link rel="stylesheet" href="app/app.css"/>
<link rel="stylesheet" href="app/v2.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--gray-20); }
  #root { display: block; }
  /* Match cursor's page chrome but flush within iframe */
  .monitoringPage {
    background: var(--gray-20);
    min-height: 100vh;
    padding: 0;
    overflow: auto;
    font-family: Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .monitoringPage .page {
    padding: 24px 36px 36px;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .monitoringPage .tabNav {
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 36px 0;
    box-sizing: border-box;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="app/data.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Existing local shell + tweaks-panel infra (needed for k-shims dependencies) -->
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/tweaks-panel.jsx"></script>

<!-- Inline shims for komponentsV2 deps used by the cursor sources -->
<script type="text/babel" src="app/k-shims.jsx"></script>

<!-- The compiled cursor bundle -->
<script type="text/babel" data-presets="typescript,react" src="app/cursor-bundle.tsx"></script>

<script type="text/babel">
const { useEffect } = React;

function App() {
  const { MonitoringPage, ToastProvider } = window;
  if (!MonitoringPage) return null;
  // Deep-link initial tab via URL hash (#anomalies or #monitors).
  useEffect(() => {
    if (window.location.hash !== "#anomalies") return;
    // After MonitoringPage mounts, click the second tab button if present.
    const tryClick = (attempts = 0) => {
      const buttons = document.querySelectorAll('[role="tab"], button[class*="tab"]');
      const anomTab = [...buttons].find(b => /anomal/i.test(b.textContent || ""));
      if (anomTab) { anomTab.click(); return; }
      if (attempts < 40) setTimeout(() => tryClick(attempts + 1), 50);
    };
    tryClick();
  }, []);

  return (
    <ToastProvider>
      <MonitoringPage/>
    </ToastProvider>
  );
}

function mount() {
  if (!window.MonitoringPage || !window.ToastProvider) {
    return setTimeout(mount, 50);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
mount();
</script>
</body>
</html>
