<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>Goals · AI Monitoring · Kustomer</title>
<link rel="stylesheet" href="kustomer/colors_and_type.css"/>
<link rel="stylesheet" href="app/app.css"/>
<link rel="stylesheet" href="app/v2.css"/>
<style>
  #version-strip {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 36px;
    background: #1A1D23;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 12px;
    z-index: 9999;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #version-strip .vs-label {
    font-size: 11px;
    color: #5A6478;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-right: 8px;
    white-space: nowrap;
  }
  #version-strip a {
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.1s, color 0.1s;
  }
  #version-strip a.vs-tab { color: #8A94A6; background: transparent; }
  #version-strip a.vs-tab:hover { color: #C8CDD8; background: #2A2D35; }
  #version-strip a.vs-tab--active { color: #ffffff; background: #2A2D35; }
  body { padding-top: 36px; }
  .app { height: calc(100vh - 36px) !important; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="app/data.js"></script>
</head>
<body>
<!-- Version tab strip -->
<div id="version-strip">
  <span class="vs-label">Version</span>
  <a href="Goals.html" class="vs-tab vs-tab--active">v2 (current)</a>
  <a href="Goals-v3-light.html" class="vs-tab">v3 Light</a>
</div>

<div id="root"></div>

<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/shell.jsx"></script>
<script type="text/babel" src="app/goals.jsx"></script>
<script type="text/babel" src="app/monitors.jsx"></script>
<script type="text/babel" src="app/inbox.jsx"></script>
<script type="text/babel" src="app/wizards.jsx"></script>
<script type="text/babel" src="app/tweaks-panel.jsx"></script>
<script type="text/babel" src="app/v2.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#2563EB",
  "density": "comfortable",
  "showLoopStrip": true,
  "showAlert": true,
  "goalColumns": 2
}/*EDITMODE-END*/;

function App() {
  const [route, setRoute] = useState({ screen: 'goals' });
  const [convoId, setConvoId] = useState(null);
  const [newGoalOpen, setNewGoalOpen] = useState(false);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { TweaksPanel, TweakSection, TweakColor, TweakToggle, TweakRadio } = window;

  // Apply accent color CSS var live
  useEffect(() => {
    document.documentElement.style.setProperty('--blue-80', tweaks.accentColor);
    document.documentElement.style.setProperty('--blue-70', tweaks.accentColor);
  }, [tweaks.accentColor]);

  const navigate = (r) => {
    if (r.screen === 'newgoal') { setNewGoalOpen(true); return; }
    setRoute(r);
    window.scrollTo(0, 0);
  };

  const counts = {
    goals: window.K_DATA.goals.length,
    monitors: window.K_DATA.monitors.length,
    inbox: window.K_DATA.suggestions.length + window.K_DATA.anomalies.length,
    computed: window.K_DATA.computedFields.length,
  };

  let main = null;
  if (route.screen === 'goals') main = <GoalsHomeV2 navigate={navigate} openConvo={setConvoId} openNewGoal={() => setNewGoalOpen(true)} tweaks={tweaks}/>;
  else if (route.screen === 'goal') main = <GoalDetailV2 id={route.id} navigate={navigate} openConvo={setConvoId}/>;
  else if (route.screen === 'inbox') main = <InboxV2 navigate={navigate} openConvo={setConvoId} highlight={route.highlight}/>;
  else if (route.screen === 'settings') main = <SettingsV2 navigate={navigate}/>;

  return (
    <ToastProvider>
      <div className="app" data-screen-label={'AI Monitoring · ' + route.screen}>
        <ShellV2 route={route} navigate={navigate} counts={counts}/>
        <main className="main">
          {main}
        </main>
        <ConversationDrawer id={convoId} onClose={() => setConvoId(null)} navigate={navigate}/>
        <NewGoalQuickModal open={newGoalOpen} onClose={() => setNewGoalOpen(false)} onCreated={() => setRoute({ screen: 'goals' })}/>
        <TweaksPanel>
          <TweakSection label="Colors">
            <TweakColor label="Accent color" id="accentColor" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)}
              options={['#2563EB','#7C3AED','#059669','#D97706','#DC2626']}/>
          </TweakSection>
          <TweakSection label="Goals home">
            <TweakToggle label="Show loop strip" id="showLoopStrip" value={tweaks.showLoopStrip} onChange={v => setTweak('showLoopStrip', v)}/>
            <TweakToggle label="Show alert banner" id="showAlert" value={tweaks.showAlert} onChange={v => setTweak('showAlert', v)}/>
            <TweakRadio label="Goal columns" id="goalColumns" value={tweaks.goalColumns} onChange={v => setTweak('goalColumns', v)}
              options={[{label:'1 col', value:1},{label:'2 col', value:2}]}/>
          </TweakSection>
          <TweakSection label="Density">
            <TweakRadio label="Card density" id="density" value={tweaks.density} onChange={v => setTweak('density', v)}
              options={[{label:'Compact', value:'compact'},{label:'Comfortable', value:'comfortable'}]}/>
          </TweakSection>
        </TweaksPanel>
      </div>
    </ToastProvider>
  );
}

function mount() {
  if (!window.GoalsHomeV2 || !window.ShellV2 || !window.InboxV2 || !window.NewGoalQuickModal || !window.useTweaks || !window.TweaksPanel) {
    return setTimeout(mount, 30);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
mount();
</script>
</body>
</html>
