<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>Goals · AI Monitoring · Kustomer</title>
<link rel="stylesheet" href="kustomer/colors_and_type.css"/>
<link rel="stylesheet" href="app/app.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="app/data.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/shell.jsx"></script>
<script type="text/babel" src="app/goals.jsx"></script>
<script type="text/babel" src="app/monitors.jsx"></script>
<script type="text/babel" src="app/inbox.jsx"></script>
<script type="text/babel" src="app/wizards.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [route, setRoute] = useState({ screen: 'goals' });
  const [convoId, setConvoId] = useState(null);
  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [newGoalOpen, setNewGoalOpen] = useState(false);
  const [newMonitorOpen, setNewMonitorOpen] = useState(false);
  const [newMonitorGoalId, setNewMonitorGoalId] = useState(null);

  const navigate = (r) => {
    if (r.screen === 'newgoal') { setNewGoalOpen(true); return; }
    if (r.screen === 'newmonitor') { setNewMonitorGoalId(r.goalId || null); setNewMonitorOpen(true); return; }
    setRoute(r);
    window.scrollTo(0, 0);
  };

  const counts = {
    goals: window.K_DATA.goals.length,
    monitors: window.K_DATA.monitors.length,
    inbox: window.K_DATA.suggestions.length + window.K_DATA.anomalies.length,
    computed: window.K_DATA.computedFields.length,
  };

  let main = null;
  if (route.screen === 'goals') main = <GoalsHome navigate={navigate} bannerDismissed={bannerDismissed} dismissBanner={() => setBannerDismissed(true)}/>;
  else if (route.screen === 'goal') main = <GoalDetail id={route.id} navigate={navigate} openConvo={setConvoId}/>;
  else if (route.screen === 'monitors') main = <MonitorsList navigate={navigate}/>;
  else if (route.screen === 'monitor') main = <MonitorDetail id={route.id} navigate={navigate} openConvo={setConvoId}/>;
  else if (route.screen === 'inbox') main = <Inbox navigate={navigate} openConvo={setConvoId} highlight={route.highlight}/>;
  else if (route.screen === 'computed') main = <ComputedFieldsList navigate={navigate}/>;

  return (
    <ToastProvider>
      <div className="app" data-screen-label={'AI Monitoring · ' + route.screen}>
        <Shell route={route} navigate={navigate} counts={counts}/>
        <main className="main">
          {main}
        </main>
        <ConversationDrawer id={convoId} onClose={() => setConvoId(null)} navigate={navigate}/>
        <NewGoalModal open={newGoalOpen} onClose={() => setNewGoalOpen(false)} onCreated={() => setRoute({ screen: 'goals' })} navigate={navigate}/>
        <NewMonitorModal open={newMonitorOpen} onClose={() => setNewMonitorOpen(false)} goalId={newMonitorGoalId} navigate={navigate}/>
      </div>
    </ToastProvider>
  );
}

// Wait for all babel scripts to register globals before mounting.
function mount() {
  if (!window.GoalsHome || !window.MonitorsList || !window.Inbox || !window.NewGoalModal || !window.Shell) {
    return setTimeout(mount, 30);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
mount();
</script>
</body>
</html>
