<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kustomer AI — Hybrid Prototype v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="hybrid_v2/typography.css" />
<style>
  html, body { height: 100%; margin: 0; overflow: hidden;
               background: #fff; color: #1F242D;
               font-family: var(--font-sans); }
  *, *::before, *::after { box-sizing: border-box; }
  #app { height: 100vh; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(31,42,46,0.12); border-radius: 999px; border: 2px solid #fff; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(31,42,46,0.22); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared bits -->
<script type="text/babel" src="hybrid_v2/js/icons.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/data.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/primitives.jsx"></script>

<!-- Sections -->
<script type="text/babel" src="hybrid_v2/js/shell.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/wizard.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/goals.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/performance.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/improve.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/resources.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/settings.jsx"></script>
<script type="text/babel" src="hybrid_v2/js/advanced.jsx"></script>

<!-- Root -->
<script type="text/babel" src="hybrid_v2/js/app.jsx"></script>
</body>
</html>
